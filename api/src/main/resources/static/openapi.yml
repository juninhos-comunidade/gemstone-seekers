openapi: 3.1.0
info:
  title: Gemstone Seekers API
  description: A knowledge validation and categorization system for directing selection
    processes
  contact:
    name: Gemstone Seekers
    url: https://github.com/juninhos-comunidade/gemstone-seekers
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0
  version: 1.0.0
servers:
- url: /
  description: Gemstone Seekers API
security:
- bearer-jwt: []
paths:
  /api/v1/jobs/{id}:
    get:
      tags:
      - job-controller
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseJobResponse"
    put:
      tags:
      - job-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseJobResponse"
    delete:
      tags:
      - job-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseVoid"
  /api/v1/companies/{id}:
    get:
      tags:
      - company-controller
      operationId: findById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseCompanyResponse"
    put:
      tags:
      - company-controller
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseCompanyResponse"
    delete:
      tags:
      - company-controller
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseVoid"
  /api/v1/jobs:
    get:
      tags:
      - job-controller
      operationId: findAll
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListJobResponse"
    post:
      tags:
      - job-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseJobResponse"
  /api/v1/jobs/{jobId}/technologies:
    get:
      tags:
      - job-technology-controller
      operationId: findByJobId
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListJobTechnologyResponse"
    post:
      tags:
      - job-technology-controller
      operationId: addTechnology
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobTechnologyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseJobTechnologyResponse"
  /api/v1/companies:
    get:
      tags:
      - company-controller
      operationId: findAll_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListCompanyResponse"
    post:
      tags:
      - company-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseCompanyResponse"
  /api/v1/companies/{companyId}/recruiters:
    get:
      tags:
      - recruiter-controller
      operationId: findByCompanyId
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListRecruiterResponse"
    post:
      tags:
      - recruiter-controller
      operationId: linkToCompany
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruiterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseRecruiterResponse"
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseRegisterResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseLoginResponse"
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseLoginResponse"
  /api/v1/profile/user:
    patch:
      tags:
      - user-profile-controller
      operationId: updateCandidateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseUserResponse"
  /api/v1/auth/complete-registration:
    patch:
      tags:
      - auth-controller
      operationId: completeRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegistrationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseCompleteRegistrationResponse"
  /api/v1/technologies:
    get:
      tags:
      - technology-controller
      operationId: getTechnologies
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListTechnologyResponse"
  /api/v1/states:
    get:
      tags:
      - state-controller
      operationId: getStates
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListStateResponse"
  /api/v1/states/{stateId}/cities:
    get:
      tags:
      - state-controller
      operationId: getCitiesByState
      parameters:
      - name: stateId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListCityResponse"
  /api/v1/recruiters/{id}:
    get:
      tags:
      - recruiter-controller
      operationId: findById_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseRecruiterResponse"
  /api/v1/profile/{userId}:
    get:
      tags:
      - user-profile-controller
      operationId: getCandidateProfile
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseCandidateProfileResponse"
  /api/v1/market-radar/technology-demand:
    get:
      tags:
      - market-radar-controller
      operationId: getTechnologyDemand
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListTechnologyDemandResponse"
  /api/v1/languages:
    get:
      tags:
      - language-controller
      operationId: getLanguages
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListLanguageResponse"
  /api/v1/countries:
    get:
      tags:
      - country-controller
      operationId: getCountries
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListCountryResponse"
  /api/v1/countries/{countryId}/states:
    get:
      tags:
      - country-controller
      operationId: getStatesByCountry
      parameters:
      - name: countryId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListStateResponse"
  /api/v1/cities:
    get:
      tags:
      - city-controller
      operationId: getCities
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseListCityResponse"
  /api/v1/jobs/{jobId}/technologies/{technologyId}:
    delete:
      tags:
      - job-technology-controller
      operationId: removeTechnology
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: technologyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BaseResponseVoid"
components:
  schemas:
    JobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        seniorityLevel:
          type: string
        department:
          type: string
        salaryMin:
          type: number
        salaryMax:
          type: number
        recruiterId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
      required:
      - companyId
      - description
      - recruiterId
      - title
    BaseResponseJobResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/JobResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        validations:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    JobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        seniorityLevel:
          type: string
        department:
          type: string
        salaryMin:
          type: number
        salaryMax:
          type: number
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - CANCELLED
        recruiterId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cnpj:
          type: string
      required:
      - name
    BaseResponseCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CompanyResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CompanyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cnpj:
          type: string
    JobTechnologyRequest:
      type: object
      properties:
        technologyId:
          type: integer
          format: int32
        isMandatory:
          type: boolean
      required:
      - technologyId
    BaseResponseJobTechnologyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/JobTechnologyResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    JobTechnologyResponse:
      type: object
      properties:
        technologyId:
          type: integer
          format: int32
        technologyName:
          type: string
        category:
          type: string
        isMandatory:
          type: boolean
    RecruiterRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        department:
          type: string
      required:
      - userId
    BaseResponseRecruiterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/RecruiterResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    RecruiterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        department:
          type: string
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - name
      - password
    BaseResponseRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/RegisterResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    BaseResponseLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/LoginResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        registrationCompleted:
          type: boolean
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    UserRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
    BaseResponseUserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/UserResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - CANDIDATE
          - RECRUITER
        documentType:
          type: string
        documentNumber:
          type: string
    CompleteRegistrationRequest:
      type: object
      properties:
        role:
          type: string
          enum:
          - CANDIDATE
          - RECRUITER
        documentType:
          type: string
        documentNumber:
          type: string
        phone:
          type: string
        summary:
          type: string
        companyId:
          type: string
          format: uuid
        department:
          type: string
      required:
      - role
    BaseResponseCompleteRegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CompleteRegistrationResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CompleteRegistrationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - CANDIDATE
          - RECRUITER
        documentType:
          type: string
        documentNumber:
          type: string
    BaseResponseListTechnologyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          type: array
          items:
            $ref: "#/components/schemas/TechnologyResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    TechnologyResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        category:
          type: string
    BaseResponseListStateResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          type: array
          items:
            $ref: "#/components/schemas/StateResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    StateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        countryId:
          type: integer
          format: int32
    BaseResponseListCityResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          type: array
          items:
            $ref: "#/components/schemas/CityResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CityResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        stateId:
          type: integer
          format: int32
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city:
          $ref: "#/components/schemas/CityResponse"
        zipCode:
          type: string
        street:
          type: string
        number:
          type: string
        neighborhood:
          type: string
        complement:
          type: string
    BaseResponseCandidateProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CandidateProfileResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CandidateLanguageResponse:
      type: object
      properties:
        languageId:
          type: integer
          format: int32
        languageName:
          type: string
        proficiency:
          type: string
          enum:
          - BASIC
          - INTERMEDIATE
          - ADVANCED
          - FLUENT
          - NATIVE
    CandidateLinkResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
    CandidateProfileResponse:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/CandidateResponse"
        address:
          $ref: "#/components/schemas/AddressResponse"
    CandidateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/UserResponse"
        phone:
          type: string
        summary:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/CandidateLinkResponse"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceResponse"
        educations:
          type: array
          items:
            $ref: "#/components/schemas/EducationResponse"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/CertificationResponse"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/CandidateLanguageResponse"
    CertificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        issuingOrganization:
          type: string
        issueDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        credentialUrl:
          type: string
    EducationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        institution:
          type: string
        fieldOfStudy:
          type: string
        degree:
          type: string
        startDate:
          type: string
          format: date
        completionDate:
          type: string
          format: date
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/TechnologyResponse"
          uniqueItems: true
    ExperienceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        companyName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
        description:
          type: string
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        projectUrl:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/TechnologyResponse"
          uniqueItems: true
    BaseResponseListTechnologyDemandResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          type: array
          items:
            $ref: "#/components/schemas/TechnologyDemandResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    TechnologyDemandResponse:
      type: object
      properties:
        technologyId:
          type: integer
          format: int32
        technologyName:
          type: string
        technologyCategory:
          type: string
        jobCount:
          type: integer
          format: int64
        mandatoryCount:
