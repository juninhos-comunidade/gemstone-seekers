    BaseResponseCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CompanyResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CompanyResponse:
