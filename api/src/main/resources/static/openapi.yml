components:
  schemas:
    JobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        seniorityLevel:
          type: string
        department:
          type: string
        salaryMin:
          type: number
        salaryMax:
          type: number
        recruiterId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
      required:
      - companyId
      - description
      - recruiterId
      - title
    BaseResponseJobResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/JobResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        validations:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    JobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        seniorityLevel:
          type: string
        department:
          type: string
        salaryMin:
          type: number
        salaryMax:
          type: number
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - CANCELLED
        recruiterId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cnpj:
          type: string
      required:
      - name
    BaseResponseCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CompanyResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CompanyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cnpj:
          type: string
    SaveAnswerRequest:
      type: object
      properties:
        questionId:
          type: integer
          format: int64
        selectedOptionId:
          type: integer
          format: int64
      required:
      - questionId
      - selectedOptionId
    BaseResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result: {}
        error:
          $ref: "#/components/schemas/ErrorResponse"
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        projectUrl:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city:
          $ref: "#/components/schemas/CityResponse"
        zipCode:
          type: string
        street:
          type: string
        number:
          type: string
        neighborhood:
          type: string
        complement:
          type: string
    BaseResponseCandidateProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CandidateProfileResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    CandidateLanguageResponse:
      type: object
      properties:
        languageId:
          type: integer
          format: int32
        languageName:
          type: string
        proficiency:
          type: string
          enum:
          - BASIC
          - INTERMEDIATE
          - ADVANCED
          - FLUENT
          - NATIVE
    CandidateLinkResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
    CandidateProfileResponse:
      type: object
      properties:
        candidate:
          $ref: "#/components/schemas/CandidateResponse"
