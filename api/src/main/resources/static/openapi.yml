          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        department:
          type: string
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - name
      - password
    BaseResponseRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/RegisterResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    BaseResponseLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/LoginResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        registrationCompleted:
          type: boolean
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    CompleteRegistrationRequest:
      type: object
      properties:
        role:
          type: string
          enum:
          - CANDIDATE
          - RECRUITER
        documentType:
          type: string
        documentNumber:
          type: string
        phone:
          type: string
        summary:
          type: string
        companyId:
          type: string
          format: uuid
        department:
          type: string
      required:
      - role
    BaseResponseCompleteRegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/CompleteRegistrationResponse"
        error:
