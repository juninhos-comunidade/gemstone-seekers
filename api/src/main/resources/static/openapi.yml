      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cnpj:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        validations:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    RecruiterRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        department:
          type: string
      required:
      - userId
    BaseResponseRecruiterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        result:
          $ref: "#/components/schemas/RecruiterResponse"
        error:
