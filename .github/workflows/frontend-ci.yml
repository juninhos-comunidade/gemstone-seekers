name: Frontend CI

"on":
  push:
    branches:
      - main
      - develop
    paths:
      - 'web/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Web path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'web/**'

  # ==========================================
  # STAGE: BUILD & SECURITY SCAN
  # ==========================================
  build-application:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build

  security-code-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep scanner
        run: pip install semgrep --quiet

      - name: Scan source code for security vulnerabilities
        run: >
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/owasp-top-ten
          --config p/secrets
          --severity ERROR
          --sarif
          --output semgrep-report.sarif
          --error
          --exclude node_modules/
          --exclude .next/
          --exclude out/

      - name: Upload code security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report-web
          path: web/semgrep-report.sarif
          retention-days: 7

  security-dependency-scan:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency Bill of Materials (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './web'
          format: 'cyclonedx'
          output: 'web/sbom.cyclonedx.json'
          exit-code: '0'

      - name: Scan dependencies for security vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './web'
          format: 'sarif'
          output: 'web/trivy-fs-report.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload dependency security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-reports-web
          path: |
            web/trivy-fs-report.sarif
            web/sbom.cyclonedx.json
          retention-days: 7

  # ==========================================
  # STAGE: VERIFY & QUALITY
  # ==========================================
  check-code-lint:
    needs: build-application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code linting rules (ESLint)
        run: pnpm exec eslint .

  check-code-formatting:
    needs: build-application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm exec prettier --check .

  unit-tests:
    needs: build-application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage requirements
        run: >
          pnpm exec vitest run --coverage.enabled true
          --coverage.statements=80
          --coverage.branches=80
          --coverage.functions=80
          --coverage.lines=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: web/coverage/
          retention-days: 7
