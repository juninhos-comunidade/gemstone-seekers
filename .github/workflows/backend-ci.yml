name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'api/**'

env:
  MAVEN_OPTS: "-Xmx2048m"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  # ==========================================
  # STAGE: BUILD & SECURITY SCAN
  # ==========================================
  compile-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile application code
        run: ./mvnw $MAVEN_CLI_OPTS clean compile -DskipTests -Dskip.git.hooks=true

      - name: Upload compiled target directory
        uses: actions/upload-artifact@v4
        with:
          name: api-target
          path: api/target/
          retention-days: 1

  security-code-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep scanner
        run: pip install semgrep --quiet

      - name: Scan source code for security vulnerabilities
        run: >
          semgrep scan
          --config p/java
          --config p/owasp-top-ten
          --config p/secrets
          --severity ERROR
          --sarif
          --output semgrep-report.sarif
          --error
          --exclude target/
          --exclude .m2/
          --exclude src/main/resources/db/seed/

      - name: Upload code security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: api/semgrep-report.sarif
          retention-days: 7

  security-dependency-scan:
    needs: compile-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate dependency Bill of Materials (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './api'
          format: 'cyclonedx'
          output: 'api/sbom.cyclonedx.json'
          exit-code: '0'

      - name: Scan dependencies for security vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './api'
          format: 'sarif'
          output: 'api/trivy-fs-report.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln,secret'

      - name: Upload dependency security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-reports
          path: |
            api/trivy-fs-report.sarif
            api/sbom.cyclonedx.json
          retention-days: 7

  # ==========================================
  # STAGE: VERIFY & QUALITY
  # ==========================================
  check-code-style:
    needs: compile-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target directory
        uses: actions/download-artifact@v4
        with:
          name: api-target
          path: api/target/

      - name: Check Java formatting rules (Checkstyle)
        run: >
          ./mvnw $MAVEN_CLI_OPTS checkstyle:checkstyle checkstyle:check
          -Dskip.git.hooks=true
          -Dcheckstyle.failOnViolation=true
          -Dcheckstyle.violationSeverity=error

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: api/target/checkstyle/
          retention-days: 7

  check-code-quality:
    needs: compile-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target directory
        uses: actions/download-artifact@v4
        with:
          name: api-target
          path: api/target/

      - name: Analyze code for quality issues (PMD)
        run: >
          ./mvnw $MAVEN_CLI_OPTS pmd:pmd pmd:check
          -Dskip.git.hooks=true
          -Dpmd.failOnViolation=true
          -Dpmd.maxAllowedViolations=0

      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: api/target/pmd/
          retention-days: 7

  check-code-bugs:
    needs: compile-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target directory
        uses: actions/download-artifact@v4
        with:
          name: api-target
          path: api/target/

      - name: Analyze bytecode for potential bugs (SpotBugs)
        run: >
          ./mvnw $MAVEN_CLI_OPTS spotbugs:spotbugs spotbugs:check
          -Dskip.git.hooks=true
          -Dspotbugs.threshold=High
          -Dspotbugs.maxAllowedViolations=0

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: api/target/spotbugs/
          retention-days: 7

  unit-and-integration-tests:
    needs: compile-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled target directory
        uses: actions/download-artifact@v4
        with:
          name: api-target
          path: api/target/

      - name: Run tests and measure coverage
        env:
          COVERAGE_MIN_INSTRUCTION: "0.80"
          COVERAGE_MIN_BRANCH: "0.80"
        run: >
          ./mvnw $MAVEN_CLI_OPTS verify jacoco:report
          -Dskip.git.hooks=true
          -Djacoco.skip=false
          -Dcoverage.minimum.instruction=$COVERAGE_MIN_INSTRUCTION
          -Dcoverage.minimum.branch=$COVERAGE_MIN_BRANCH

      - name: Upload test execution logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: api/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE: PACKAGE & SCAN
  # ==========================================
  build-docker-image:
    needs: [unit-and-integration-tests, check-code-bugs, check-code-quality, check-code-style, security-code-scan, security-dependency-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Downloads the compiled .jar from the first job (maven-compile) so the Dockerfile can use it
      - name: Download compiled target directory
        uses: actions/download-artifact@v4
        with:
          name: api-target
          path: api/target/

      - name: Build and Save Docker Image
        run: |
          docker build -t api-image:${{ github.sha }} .
          docker save api-image:${{ github.sha }} -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: api/image.tar
          retention-days: 1

  security-docker-image-scan:
    needs: build-docker-image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: api/

      - name: Scan Docker image for vulnerabilities (Table view)
        uses: aquasecurity/trivy-action@master
        with:
          input: 'api/image.tar'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Scan Docker image for vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          input: 'api/image.tar'
          format: 'sarif'
          output: 'api/trivy-image-report.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Docker image security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: api/trivy-image-report.sarif
          retention-days: 7

  # ==========================================
  # STAGE: PUBLISH
  # ==========================================
  publish-docker-image:
    needs: security-docker-image-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: api/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load, Tag and Push Docker image
        run: |
          docker load -i image.tar

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID="ghcr.io/$REPO_OWNER/gemstone-seekers-api"

          # Commit SHA tag
          docker tag api-image:${{ github.sha }} $IMAGE_ID:${{ github.sha }}

          # Branch name tag (e.g., main, develop)
          REF_SLUG=$(echo "${{ github.ref_name }}" | tr -cd '[:alnum:]_-')
          docker tag api-image:${{ github.sha }} $IMAGE_ID:$REF_SLUG

          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:$REF_SLUG

          # Automatically creates the "latest" tag if on the main branch
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag api-image:${{ github.sha }} $IMAGE_ID:latest
            docker push $IMAGE_ID:latest
          fi
